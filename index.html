<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="York AC">
<meta name="theme-color" content="#0b1220">
<title>York AC Remote</title>
<style>
  :root{
    --bg:#0b1220; --panel:#131c2e; --panel2:#1a2540; --line:#25324f;
    --text:#e8eefc; --dim:#8a99bd; --accent:#3fa9ff; --accent2:#7cd4ff;
    --warm:#ff8a3d; --ok:#3ddc97; --off:#4a5674; --danger:#ff5d6c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-user-select:none;user-select:none}
  body{min-height:100vh;display:flex;justify-content:center}
  .app{width:100%;max-width:440px;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 24px)}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .brand{font-weight:700;letter-spacing:.14em;font-size:15px}
  .brand small{display:block;font-weight:500;letter-spacing:.02em;color:var(--dim);font-size:12px;margin-top:2px}
  .status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);background:var(--panel);
    border:1px solid var(--line);padding:6px 10px;border-radius:999px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--off)}
  .dot.ok{background:var(--ok)} .dot.demo{background:var(--warm)} .dot.err{background:var(--danger)}
  .iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--text);width:38px;height:38px;border-radius:12px;
    display:grid;place-items:center;cursor:pointer}

  /* Dial */
  .dialwrap{position:relative;margin:6px auto 4px;width:280px;height:280px}
  svg.dial{width:100%;height:100%;transform:rotate(135deg)}
  .dial .track{fill:none;stroke:var(--panel2);stroke-width:16;stroke-linecap:round}
  .dial .prog{fill:none;stroke:url(#g);stroke-width:16;stroke-linecap:round;transition:stroke-dashoffset .35s ease}
  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
  .temp{font-size:84px;font-weight:200;line-height:1;letter-spacing:-.03em}
  .temp sup{font-size:28px;font-weight:300;vertical-align:top;position:relative;top:10px;margin-left:2px}
  .sub{color:var(--dim);font-size:14px;margin-top:8px;text-transform:uppercase;letter-spacing:.12em}
  .off .temp,.off .sub{color:var(--off)}
  .off .prog{stroke:var(--off)}

  .tempctl{display:flex;justify-content:center;gap:90px;margin-top:-34px;position:relative}
  .round{width:62px;height:62px;border-radius:50%;background:var(--panel);border:1px solid var(--line);color:var(--text);
    font-size:30px;font-weight:300;cursor:pointer;display:grid;place-items:center;transition:transform .08s}
  .round:active{transform:scale(.92);background:var(--panel2)}

  .power{display:flex;justify-content:center;margin:22px 0 18px}
  .powerbtn{width:82px;height:82px;border-radius:50%;border:none;cursor:pointer;display:grid;place-items:center;
    background:var(--panel);box-shadow:0 0 0 1px var(--line) inset;color:var(--dim);transition:all .2s}
  .powerbtn.on{background:linear-gradient(145deg,#3fa9ff,#1f6fe0);color:#fff;box-shadow:0 10px 30px rgba(63,169,255,.35)}
  .powerbtn:active{transform:scale(.95)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
  .label{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;margin:0 0 10px 2px}
  .seg{display:grid;gap:8px}
  .seg.c5{grid-template-columns:repeat(5,1fr)} .seg.c4{grid-template-columns:repeat(4,1fr)}
  .seg button{background:var(--panel2);border:1px solid transparent;color:var(--dim);border-radius:12px;padding:10px 4px;
    font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit}
  .seg button svg{width:22px;height:22px}
  .seg button.sel{color:var(--text);border-color:var(--accent);background:rgba(63,169,255,.12)}
  .seg button.sel.heat{border-color:var(--warm);background:rgba(255,138,61,.12)}
  .toggles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tg{background:var(--panel2);border:1px solid transparent;color:var(--dim);border-radius:12px;padding:12px 4px;font-size:12px;
    cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit}
  .tg svg{width:22px;height:22px}
  .tg.on{color:var(--text);border-color:var(--accent2);background:rgba(124,212,255,.12)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  select,input[type=text]{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;font-size:14px;font-family:inherit;width:100%}
  .timer{display:flex;gap:8px;align-items:center}
  .timer select{flex:1}
  .countdown{font-size:13px;color:var(--accent2);white-space:nowrap}
  .disabled{opacity:.45;pointer-events:none}

  /* Settings sheet */
  .sheet{position:fixed;inset:0;background:rgba(3,6,14,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .sheet.show{display:flex}
  .sheetbody{background:var(--panel);border-top-left-radius:22px;border-top-right-radius:22px;width:100%;max-width:440px;
    padding:18px 18px calc(env(safe-area-inset-bottom) + 22px);border:1px solid var(--line);max-height:88vh;overflow:auto}
  .sheetbody h2{margin:0 0 4px;font-size:18px}
  .sheetbody p{color:var(--dim);font-size:13px;line-height:1.5;margin:6px 0 14px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;letter-spacing:.05em}
  .btn{width:100%;padding:13px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn.primary{background:var(--accent);color:#04101f}
  .btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);margin-top:8px}
  .learnbox{background:var(--panel2);border-radius:12px;padding:12px;font-size:13px;color:var(--dim);margin-top:10px;display:none;line-height:1.5}
  .learnbox.show{display:block}
  .learnbox b{color:var(--text)}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(30px);
    background:#24324f;color:var(--text);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:all .25s;z-index:20;
    border:1px solid var(--line);white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .foot{text-align:center;color:var(--dim);font-size:11px;margin-top:10px}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand">YORK<small id="roomName">Air Conditioner</small></div>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>
      <button class="iconbtn" id="openSettings" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div id="main">
    <div class="dialwrap">
      <svg class="dial" viewBox="0 0 200 200">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7cd4ff"/><stop offset="1" stop-color="#1f6fe0"/></linearGradient></defs>
        <circle class="track" cx="100" cy="100" r="84" stroke-dasharray="395.8 527.8"/>
        <circle class="prog" id="prog" cx="100" cy="100" r="84" stroke-dasharray="395.8 527.8" stroke-dashoffset="395.8"/>
      </svg>
      <div class="center">
        <div class="temp" id="temp">24<sup>°C</sup></div>
        <div class="sub" id="sub">Cool · Auto fan</div>
      </div>
    </div>
    <div class="tempctl">
      <button class="round" id="minus" aria-label="Lower temperature">−</button>
      <button class="round" id="plus" aria-label="Raise temperature">+</button>
    </div>

    <div class="power">
      <button class="powerbtn" id="power" aria-label="Power">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
      </button>
    </div>

    <div class="card" id="modeCard">
      <div class="label">Mode</div>
      <div class="seg c5" id="modes">
        <button data-v="cool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2v20M4.9 6l14.2 12M19.1 6 4.9 18M9 3.5 12 6l3-2.5M9 20.5 12 18l3 2.5"/></svg>Cool</button>
        <button data-v="dry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2.7S5 10 5 14.5a7 7 0 0 0 14 0C19 10 12 2.7 12 2.7z"/></svg>Dry</button>
        <button data-v="fan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 12c0-4 1-8 4-8s3 4-4 8zM12 12c4 0 8 1 8 4s-4 3-8-4zM12 12c0 4-1 8-4 8s-3-4 4-8zM12 12c-4 0-8-1-8-4s4-3 8 4z"/></svg>Fan</button>
        <button data-v="auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19 12 4l7 15M8 13h8"/></svg>Auto</button>
        <button data-v="heat" class="heatbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Heat</button>
      </div>
    </div>

    <div class="card" id="fanCard">
      <div class="label">Fan speed</div>
      <div class="seg c4" id="fans">
        <button data-v="auto">Auto</button>
        <button data-v="low">Low</button>
        <button data-v="medium">Med</button>
        <button data-v="high">High</button>
      </div>
    </div>

    <div class="card" id="featCard">
      <div class="label">Features</div>
      <div class="toggles">
        <button class="tg" data-k="swing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8c3-3 13-3 16 0M4 16c3 3 13 3 16 0M12 8v8M9 13l3 3 3-3"/></svg>Swing</button>
        <button class="tg" data-k="turbo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Turbo</button>
        <button class="tg" data-k="econo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19c0-9 6-14 15-14 0 9-5 15-14 15M5 19l7-7"/></svg>Eco</button>
        <button class="tg" data-k="sleep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Sleep</button>
      </div>
    </div>

    <div class="card">
      <div class="label">Off timer</div>
      <div class="timer">
        <select id="timer">
          <option value="0">No timer</option>
          <option value="30">30 min</option>
          <option value="60">1 hour</option>
          <option value="120">2 hours</option>
          <option value="180">3 hours</option>
          <option value="240">4 hours</option>
          <option value="360">6 hours</option>
          <option value="480">8 hours</option>
        </select>
        <span class="countdown" id="countdown"></span>
      </div>
    </div>
    <div class="foot" id="foot"></div>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="sheetbody">
    <h2>Settings</h2>
    <p>The phone sends commands over Wi-Fi to the IR bridge, which blinks the infrared code to your York unit.</p>
    <div class="field">
      <label>Room name</label>
      <input type="text" id="setName" maxlength="24" placeholder="Living room">
    </div>
    <div class="field">
      <label>IR protocol (which remote codes your unit understands)</label>
      <select id="setProto">
        <option value="YORK">York (GRYLH2A remote)</option>
        <option value="DAIKIN">Daikin / York ECGS01 (Daikin 280-bit)</option>
        <option value="DAIKIN2">Daikin2</option>
        <option value="DAIKIN64">Daikin64</option>
        <option value="DAIKIN128">Daikin128</option>
        <option value="DAIKIN152">Daikin152</option>
        <option value="DAIKIN160">Daikin160</option>
        <option value="DAIKIN176">Daikin176</option>
        <option value="DAIKIN216">Daikin216</option>
        <option value="MIDEA">Midea</option>
        <option value="COOLIX">Coolix (Midea-made units)</option>
        <option value="GREE">Gree</option>
        <option value="TCL112AC">TCL</option>
        <option value="HAIER_AC">Haier</option>
      </select>
    </div>
    <button class="btn primary" id="learnBtn">Detect from my York remote</button>
    <div class="learnbox" id="learnBox"></div>
    <button class="btn ghost" id="testBtn">Send test signal (current settings)</button>
    <button class="btn ghost" id="closeSettings">Done</button>
    <p id="devInfo" style="margin-top:14px;font-size:12px"></p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const MIN=16, MAX=30;
  const MODE_LABEL={cool:"Cool",dry:"Dry",fan:"Fan",auto:"Auto",heat:"Heat"};
  const FAN_LABEL={auto:"Auto fan",low:"Low fan",medium:"Med fan",high:"High fan"};
  let demo=false, online=false, sendTimer=null, pending=false, lastUserAction=0;
  let s={power:false,mode:"cool",temp:24,fan:"auto",swing:false,turbo:false,econo:false,sleep:false,
         timer:0,timerLeft:0,protocol:"YORK",name:"Air Conditioner"};

  const $=id=>document.getElementById(id);
  const prog=$("prog"), ARC=395.8;

  function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");
    clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1800);}

  function setStatus(kind,text){$("dot").className="dot "+kind;$("statusText").textContent=text;}

  function render(){
    document.body.classList.toggle("off",!s.power);
    $("app").classList.toggle("off",!s.power);
    const noTemp = s.mode==="fan";
    $("temp").innerHTML = noTemp ? "—" : (s.temp+"<sup>°C</sup>");
    $("sub").textContent = s.power ? (MODE_LABEL[s.mode]+" · "+FAN_LABEL[s.fan]) : "Off";
    const frac=(s.temp-MIN)/(MAX-MIN);
    prog.style.strokeDashoffset = noTemp ? ARC : ARC*(1-frac);
    prog.setAttribute("stroke", "");
    $("power").classList.toggle("on",s.power);
    document.querySelectorAll("#modes button").forEach(b=>{
      b.classList.toggle("sel",b.dataset.v===s.mode);
      b.classList.toggle("heat",b.dataset.v==="heat");});
    document.querySelectorAll("#fans button").forEach(b=>b.classList.toggle("sel",b.dataset.v===s.fan));
    document.querySelectorAll(".tg").forEach(b=>b.classList.toggle("on",!!s[b.dataset.k]));
    ["minus","plus"].forEach(id=>$(id).classList.toggle("disabled",!s.power||noTemp));
    ["modeCard","fanCard","featCard"].forEach(id=>$(id).classList.toggle("disabled",!s.power));
    $("timer").value=String(s.timer||0);
    $("countdown").textContent = (s.power && s.timerLeft>0) ? fmtLeft(s.timerLeft) : "";
    $("roomName").textContent=s.name||"Air Conditioner";
  }
  function fmtLeft(sec){const h=Math.floor(sec/3600),m=Math.ceil((sec%3600)/60);
    return "Off in "+(h?h+"h ":"")+(m?m+"m":"");}

  // ---- Networking -------------------------------------------------------
  async function api(path,opts){
    const r=await fetch(path,Object.assign({cache:"no-store"},opts||{}));
    if(!r.ok) throw new Error(await r.text()||r.status);
    return r.json();
  }
  function merge(d){ for(const k in d) if(k in s || k==="model") s[k]=d[k]; }

  async function load(){
    try{
      const d=await api("/api/state");
      merge(d); online=true; demo=false;
      setStatus("ok","Connected");
      $("devInfo").textContent="Bridge: "+(d.ip||location.host)+" · IR protocol "+s.protocol+(d.fw?(" · fw "+d.fw):"");
    }catch(e){
      demo=true; online=false;
      setStatus("demo","Demo mode");
      $("foot").textContent="Demo mode: no IR bridge found. Open this app from the bridge's address (http://york-ac.local) on your home Wi-Fi.";
    }
    $("setName").value=s.name; $("setProto").value=s.protocol;
    render();
  }

  function queueSend(immediate){
    lastUserAction=Date.now(); render();
    if(navigator.vibrate) try{navigator.vibrate(12);}catch(e){}
    clearTimeout(sendTimer);
    sendTimer=setTimeout(send, immediate?0:450);
  }
  async function send(){
    if(demo){ if(s.timer>0 && s.power && !s.timerLeft) s.timerLeft=s.timer*60; render(); return; }
    pending=true;
    const body=new URLSearchParams({power:s.power?1:0,mode:s.mode,temp:s.temp,fan:s.fan,
      swing:s.swing?1:0,turbo:s.turbo?1:0,econo:s.econo?1:0,sleep:s.sleep?1:0,timer:s.timer});
    try{
      const d=await api("/api/state",{method:"POST",body});
      merge(d); setStatus("ok","Sent"); setTimeout(()=>online&&setStatus("ok","Connected"),1200);
    }catch(e){ setStatus("err","Not sent"); toast("Could not reach the IR bridge"); }
    pending=false; render();
  }

  // poll so the app follows changes made with the physical remote / timer
  setInterval(async()=>{
    if(demo){ if(s.timerLeft>0){ s.timerLeft=Math.max(0,s.timerLeft-5);
        if(s.timerLeft===0&&s.timer>0){s.power=false;s.timer=0;toast("Timer: switched off");} render(); } return; }
    if(pending || Date.now()-lastUserAction<2500) return;
    try{ merge(await api("/api/state")); if(!online){online=true;setStatus("ok","Connected");} render(); }
    catch(e){ online=false; setStatus("err","Offline"); }
  },5000);

  // ---- Controls ---------------------------------------------------------
  $("power").onclick=()=>{ s.power=!s.power; if(!s.power){s.timer=0;s.timerLeft=0;} queueSend(true); };
  $("plus").onclick=()=>{ if(s.temp<MAX){s.temp++;queueSend();} };
  $("minus").onclick=()=>{ if(s.temp>MIN){s.temp--;queueSend();} };
  document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>{s.mode=b.dataset.v;queueSend();});
  document.querySelectorAll("#fans button").forEach(b=>b.onclick=()=>{s.fan=b.dataset.v;queueSend();});
  document.querySelectorAll(".tg").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k; s[k]=!s[k];
    if(k==="turbo"&&s.turbo) s.econo=false;
    if(k==="econo"&&s.econo) s.turbo=false;
    queueSend(); });
  $("timer").onchange=e=>{ s.timer=+e.target.value; s.timerLeft=s.timer*60;
    if(s.timer && !s.power) toast("Timer starts when the AC is on");
    else if(s.timer) toast("AC will switch off in "+fmtLeft(s.timer*60).replace("Off in ",""));
    queueSend(true); };

  // ---- Settings sheet ---------------------------------------------------
  $("openSettings").onclick=()=>$("sheet").classList.add("show");
  $("closeSettings").onclick=saveSettings;
  $("sheet").onclick=e=>{ if(e.target.id==="sheet") saveSettings(); };
  async function saveSettings(){
    $("sheet").classList.remove("show");
    const name=$("setName").value.trim()||"Air Conditioner", proto=$("setProto").value;
    if(name===s.name && proto===s.protocol) return;
    s.name=name; s.protocol=proto; render();
    if(demo) return;
    try{ merge(await api("/api/config",{method:"POST",body:new URLSearchParams({name,protocol:proto})}));
      toast("Saved · protocol "+s.protocol); }
    catch(e){ toast("Save failed: "+e.message); }
    render();
  }
  $("testBtn").onclick=async()=>{
    s.protocol=$("setProto").value;
    if(demo){toast("Demo mode: nothing sent");return;}
    try{ await api("/api/config",{method:"POST",body:new URLSearchParams({protocol:s.protocol})});
      await send(); toast("Sent with "+s.protocol+" – did the AC beep?"); }
    catch(e){ toast("Failed: "+e.message); }
  };
  $("learnBtn").onclick=async()=>{
    const box=$("learnBox"); box.classList.add("show");
    if(demo){ box.innerHTML="Demo mode: connect to the IR bridge first."; return; }
    box.innerHTML="<b>Listening…</b> Point your original York remote at the bridge's IR receiver and press the power button once.";
    try{ await api("/api/learn",{method:"POST"}); }catch(e){ box.textContent="Bridge error: "+e.message; return; }
    const t0=Date.now();
    const poll=async()=>{
      try{
        const d=await api("/api/learn");
        if(d.status==="found"){
          box.innerHTML="<b>Detected: "+d.protocol+"</b>"+(d.supported?" – saved. Your phone remote now uses this protocol.":
            " – this protocol has no full A/C support in the library. Raw code: "+d.raw);
          if(d.supported){ s.protocol=d.protocol; $("setProto").value=d.protocol;
            if(![...$("setProto").options].some(o=>o.value===d.protocol)){
              const o=document.createElement("option");o.value=o.textContent=d.protocol;$("setProto").appendChild(o);$("setProto").value=d.protocol;}
            load(); }
          return;
        }
        if(d.status==="unknown"){ box.innerHTML="<b>Signal received but not recognised.</b> Try again, holding the remote 5–10 cm from the receiver. Raw length: "+d.len; return; }
      }catch(e){}
      if(Date.now()-t0<20000) setTimeout(poll,700); else box.innerHTML="No signal heard in 20 s. Check the IR receiver wiring and try again.";
    };
    poll();
  };

  load();
})();
</script>
</body>
</html>
